name: "Build"
on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: lagoon
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: https://codeberg.org/wackbyte/rust-toolchain@trunk
        with:
          toolchain: stable

      - name: Compile
        run: cargo build --release

      - name: Archive artefacts
        uses: actions/upload-artifact@v4
        with:
          name: socute-${{ matrix.os }}
          path: target/release/socute*
