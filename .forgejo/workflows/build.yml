name: "Build"
on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: lagoon
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: https://codeberg.org/wackbyte/rust-toolchain@trunk
        with:
          toolchain: stable

      - name: Compile (debug)
        run: cargo build

      - name: Test (debug)
        run: cargo test
