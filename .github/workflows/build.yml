name: "Build"
on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: https://codeberg.org/wackbyte/rust-toolchain@trunk
        with:
          toolchain: stable

      - name: Compile (debug)
        run: cargo build

      - name: Test (debug)
        run: cargo test

      - name: Compile (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release
